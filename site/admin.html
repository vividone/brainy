<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brainy — admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/brand.svg" />
    <link rel="icon" sizes="32x32" href="/favicon.ico" />
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --violet: #7c3aed;
        --green: #059669;
        --amber: #b45309;
        --red: #b91c1c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f8fafc;
        color: var(--ink);
        font-family: 'Nunito', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        line-height: 1.5;
      }
      .wrap { width: min(1180px, 100% - 2rem); margin: 0 auto; padding: 1.75rem 0 4rem; }
      h1 { font-size: 1.55rem; font-weight: 900; margin: 0; letter-spacing: -0.02em; }
      h2 { font-size: 1.05rem; font-weight: 900; margin: 2rem 0 0.75rem; }
      h3 { font-size: 0.95rem; font-weight: 900; margin: 0 0 0.6rem; }
      .sub { color: var(--muted); font-weight: 600; margin: 0.2rem 0 1.25rem; font-size: 0.9rem; }

      input, select, button, textarea { font: inherit; }
      input, select, textarea {
        width: 100%; height: 44px; padding: 0 0.8rem; border-radius: 12px;
        border: 2px solid var(--line); outline: none; font-weight: 700; background: #fff;
        color: var(--ink);
      }
      input:focus, select:focus, textarea:focus { border-color: var(--violet); }
      label { display: block; font-size: 0.72rem; font-weight: 900; text-transform: uppercase;
        letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.25rem; }
      button {
        height: 44px; padding: 0 1.2rem; border-radius: 12px; border: 0; white-space: nowrap;
        background: var(--violet); color: #fff; font-weight: 800; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      button.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); }
      button.danger { background: #fff; color: var(--red); border: 2px solid #fecaca; }
      button.sm { height: 34px; padding: 0 0.7rem; border-radius: 9px; font-size: 0.8rem; }

      /* A password field with a reveal button tucked inside it. */
      .reveal { position: relative; }
      .reveal input { padding-right: 3rem; }
      .reveal button {
        position: absolute; inset-block: 0; right: 0; width: 3rem; height: 100%;
        padding: 0; background: none; border: 0; color: var(--muted);
        font-size: 1.05rem; line-height: 1; cursor: pointer;
      }
      .reveal button:hover { color: var(--ink); }
      .reveal button[aria-pressed='true'] { color: var(--violet); }
      .reveal button:focus-visible { outline: 2px solid var(--violet); outline-offset: -2px; border-radius: 10px; }

      .gate { max-width: 380px; margin: 12vh auto; }
      .gate h1 { text-align: center; }
      .gate .sub { text-align: center; }
      .gate .field { margin-bottom: 0.7rem; }

      .bar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
      .bar .who { color: var(--muted); font-weight: 700; font-size: 0.85rem; margin-left: auto; }
      .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin: 1.25rem 0 0.5rem; }
      .tabs button {
        background: #fff; color: var(--muted); border: 2px solid var(--line);
        height: 40px; padding: 0 0.9rem; font-size: 0.9rem;
      }
      .tabs button[aria-current='true'] { background: var(--ink); color: #fff; border-color: var(--ink); }

      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; }
      .tile { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 0.9rem 1rem; }
      .tile b { display: block; font-size: 1.7rem; font-weight: 900; letter-spacing: -0.02em; }
      .tile span { color: var(--muted); font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }

      .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem; }
      .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
      .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: flex-end; }
      .row > div { flex: 1 1 130px; }
      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
      th, td { text-align: left; padding: 0.5rem 0.45rem; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
      td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
      td.acts { white-space: nowrap; }
      tr:last-child td { border-bottom: 0; }

      code, .mono {
        background: #f1f5f9; padding: 0.12rem 0.4rem; border-radius: 6px;
        font-family: 'SFMono-Regular', Consolas, monospace; font-size: 0.85em; font-weight: 700;
      }
      .tag {
        display: inline-block; border-radius: 999px; padding: 0.1rem 0.5rem;
        font-size: 0.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.03em;
      }
      .tag.active { background: #d1fae5; color: #065f46; }
      .tag.pending { background: #e2e8f0; color: #475569; }
      .tag.expired { background: #fef3c7; color: var(--amber); }
      .tag.revoked { background: #fee2e2; color: var(--red); }
      .tag.plan { background: #ede9fe; color: #5b21b6; }

      .chart { display: flex; align-items: flex-end; gap: 3px; height: 130px; }
      .chart div { flex: 1; background: var(--violet); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
      .chart div:hover::after {
        content: attr(data-label); position: absolute; bottom: 100%; left: 50%;
        transform: translateX(-50%); background: var(--ink); color: #fff;
        font-size: 0.7rem; padding: 0.2rem 0.45rem; border-radius: 6px; white-space: nowrap; z-index: 2;
      }
      .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.7rem; font-weight: 700; margin-top: 0.35rem; }

      .empty { color: var(--muted); font-weight: 600; padding: 1.25rem 0; text-align: center; }
      .err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 0.7rem 0.9rem; border-radius: 12px; font-weight: 700; }
      .ok { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 0.7rem 0.9rem; border-radius: 12px; font-weight: 700; }
      .note { color: var(--muted); font-size: 0.8rem; font-weight: 600; margin-top: 0.6rem; }
      .flash { position: fixed; inset-inline: 0; bottom: 1rem; display: flex; justify-content: center; pointer-events: none; }
      .flash > div { pointer-events: auto; max-width: min(520px, 92vw); box-shadow: 0 8px 28px rgb(15 23 42 / 0.18); }
          /* The same owl as the favicon and the website, so the dashboard is
         visibly the same product. */
      h1 .mark { width: 26px; height: 26px; border-radius: 6px; vertical-align: -5px; margin-right: 0.15rem; }
    </style>
  </head>
  <body>
    <div id="root" class="wrap"></div>
    <div class="flash" id="flash"></div>

    <script src="/admin.js" defer></script>
  </body>
</html>
